apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeNetwork
metadata:
  name: net-${template_short_name}
spec:
  routingMode: REGIONAL
  autoCreateSubnetworks: false
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeSubnetwork
metadata:
  name: subnet-${template_short_name}
spec:
  ipCidrRange: 10.0.0.0/16
  region: us-central1
  networkRef:
    name: net-${template_short_name}
