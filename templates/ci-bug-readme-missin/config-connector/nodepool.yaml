apiVersion: container.cnrm.cloud.google.com/v1beta1
kind: ContainerNodePool
metadata:
  name: np-${template_short_name}
spec:
  clusterRef:
    name: cluster-${template_short_name}
  location: us-central1
  nodeLocations:
    - us-central1-a
    - us-central1-b
    - us-central1-c
  nodeCount: 1
  nodeConfig:
    machineType: e2-standard-4

    diskSizeGb: 100
    oauthScopes:
      - "https://www.googleapis.com/auth/cloud-platform"
