apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-and-force-succ-web
  labels:
    app: audit-and-force-succ-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: audit-and-force-succ-web
  template:
    metadata:
      labels:
        app: audit-and-force-succ-web
    spec:
      containers:
      - name: nginx
        image: nginx:stable-alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: audit-and-force-succ-svc
  labels:
    app: audit-and-force-succ-web
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
  selector:
    app: audit-and-force-succ-web
