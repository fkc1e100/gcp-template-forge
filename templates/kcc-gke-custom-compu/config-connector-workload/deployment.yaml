apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-custom-compute
  labels:
    app: hello-custom-compute
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-custom-compute
  template:
    metadata:
      labels:
        app: hello-custom-compute
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
