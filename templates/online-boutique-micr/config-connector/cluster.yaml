apiVersion: container.cnrm.cloud.google.com/v1beta1
kind: ContainerCluster
metadata:
  name: online-boutique-micr-cluster
spec:
  location: us-central1
  networkRef:
    name: online-boutique-micr-net
  subnetworkRef:
    name: online-boutique-micr-subnet
  ipAllocationPolicy:
    useIpAliases: true
  workloadIdentityConfig:
    workloadPool: gca-gke-2025.svc.id.goog
