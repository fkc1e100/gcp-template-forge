apiVersion: container.cnrm.cloud.google.com/v1beta1
kind: ContainerCluster
metadata:
  name: ${cluster_name}
  namespace: config-connector
spec:
  location: ${zone}
  initialNodeCount: 1
  removeDefaultNodePool: true
  networkRef:
    name: ${network_name}
  subnetworkRef:
    name: ${subnet_name}
  ipAllocationPolicy:
    useIpAliases: true
  workloadIdentityConfig:
    workloadPool: gca-gke-2025.svc.id.goog
