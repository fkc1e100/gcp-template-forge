apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeNetwork
metadata:
  name: ${network_name}
  namespace: config-connector
spec:
  autoCreateSubnetworks: false
---
apiVersion: compute.cnrm.cloud.google.com/v1beta1
kind: ComputeSubnetwork
metadata:
  name: ${subnet_name}
  namespace: config-connector
spec:
  ipCidrRange: 10.0.0.0/16
  region: ${region}
  networkRef:
    name: ${network_name}
