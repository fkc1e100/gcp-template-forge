apiVersion: container.cnrm.cloud.google.com/v1beta1
kind: ContainerNodePool
metadata:
  name: online-boutique-micr-pool
spec:
  clusterRef:
    name: online-boutique-micr-cluster
  location: us-central1
  nodeLocations:
    - us-central1-a
    - us-central1-b
    - us-central1-c
  nodeCount: 1
  nodeConfig:
    machineType: e2-standard-4
    diskSizeGb: 100
    diskType: pd-standard
    oauthScopes:
      - "https://www.googleapis.com/auth/cloud-platform"
