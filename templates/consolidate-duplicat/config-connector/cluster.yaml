apiVersion: container.cnrm.cloud.google.com/v1beta1
kind: ContainerCluster
metadata:
  name: consolidate-duplicat-cluster
spec:
  location: us-central1
  networkRef:
    name: consolidate-duplicat-vpc
  subnetworkRef:
    name: consolidate-duplicat-subnet
  ipAllocationPolicy:
    useIpAliases: true
  workloadIdentityConfig:
    workloadPool: gca-gke-2025.svc.id.goog
