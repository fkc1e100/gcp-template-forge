apiVersion: container.cnrm.cloud.google.com/v1beta1
kind: ContainerNodePool
metadata:
  name: ${CLUSTER_NAME}-np
spec:
  clusterRef:
    name: ${CLUSTER_NAME}
  location: ${REGION}
  nodeLocations:
    - ${REGION}-a
    - ${REGION}-b
    - ${REGION}-c
  initialNodeCount: 1
  nodeConfig:
    machineType: e2-standard-4
    diskSizeGb: 100
    diskType: pd-standard
    oauthScopes:
      - "https://www.googleapis.com/auth/cloud-platform"
