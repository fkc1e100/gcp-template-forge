apiVersion: container.cnrm.cloud.google.com/v1beta1
kind: ContainerNodePool
metadata:
  name: ci-bug-readme-in-tem-node-pool
spec:
  clusterRef:
    name: ci-bug-readme-in-tem-cluster
  location: us-central1
  nodeLocations:
    - us-central1-a
    - us-central1-b
  nodCount: 1
  autoscaling:
    minNodeCount: 1
    maxNodeCount: 5
  nodeConfig:
    machineType: e2-standard-4
    diskSizeGb: 100
    oauthScopes:
      - "https://www.googleapis.com/auth/cloud-platform"
